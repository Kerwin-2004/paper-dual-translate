name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.pymupdf-label }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            pymupdf-spec: "==1.24.0"
            pymupdf-label: "minimum PyMuPDF"
          - python-version: "3.10"
            pymupdf-spec: ">=1.24"
            pymupdf-label: "latest PyMuPDF"
          - python-version: "3.12"
            pymupdf-spec: ">=1.24"
            pymupdf-label: "latest PyMuPDF"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-arphic-uming
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip "PyMuPDF${{ matrix.pymupdf-spec }}"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
