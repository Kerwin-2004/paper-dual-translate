name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-arphic-uming
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip "PyMuPDF>=1.24"
      - name: Compile scripts
        run: python -m compileall -q scripts tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
